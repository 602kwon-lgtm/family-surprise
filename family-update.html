<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>가족 OS 업데이트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#0e1320; --bg2:#1a2236;
    --panel:#161d2e; --panel-line:#28324a;
    --txt:#e7ecf6; --dim:#8893ab;
    --accent:#4ea0ff; --accent2:#39d4c4;
    --ok:#46d6a0;
    --warm:#ffb27a; --warm-deep:#ef6a52; --gold:#ffd27a;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:"Gowun Dodum",sans-serif; color:var(--txt);
    background:radial-gradient(circle at 30% 0%, #1d2740 0%, transparent 55%), linear-gradient(165deg,var(--bg1),var(--bg2));
    min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:22px 16px; overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:30px 30px; mask:radial-gradient(circle at 50% 40%,#000,transparent 80%);
  }

  .phone{
    position:relative; width:100%; max-width:360px;
    background:var(--panel); border:1px solid var(--panel-line); border-radius:30px;
    padding:24px 22px 26px; min-height:520px;
    box-shadow:0 30px 60px -22px rgba(0,0,0,.7), 0 0 0 6px rgba(255,255,255,.02);
    display:flex; flex-direction:column;
    animation:rise .5s ease both;
    transition:background .6s ease, border-color .6s ease;
  }
  @keyframes rise{ from{ opacity:0; transform:translateY(20px) } to{ opacity:1; transform:none } }

  .statusbar{ display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--dim);
    font-family:"JetBrains Mono",monospace; margin-bottom:22px; }
  .statusbar .dots{ letter-spacing:2px; }

  /* ===== 설치 화면 ===== */
  .install{ flex:1; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .iconwrap{
    width:96px; height:96px; border-radius:24px; margin:6px 0 20px;
    background:linear-gradient(160deg,#22324f,#1a2740); border:1px solid var(--panel-line);
    display:flex; align-items:center; justify-content:center; font-size:46px; position:relative;
    box-shadow:0 0 30px rgba(78,160,255,.25);
  }
  .iconwrap .ring{
    position:absolute; inset:-6px; border-radius:28px; border:2px solid transparent;
    border-top-color:var(--accent); border-right-color:var(--accent2);
    animation:spin 1.1s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg) } }
  .app-name{ font-family:"Black Han Sans",sans-serif; font-size:24px; letter-spacing:.5px; }
  .ver{ font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--dim); margin-top:4px; }
  .ver b{ color:var(--accent2); }

  .progwrap{ width:100%; margin-top:30px; }
  .progtop{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:9px; }
  .progtop .lbl{ font-size:13px; color:var(--dim); }
  .progtop .pct{ font-family:"JetBrains Mono",monospace; font-size:18px; color:var(--accent); }
  .track{ height:10px; border-radius:99px; background:#0c1120; overflow:hidden; border:1px solid var(--panel-line); }
  .track > i{ display:block; height:100%; width:0; border-radius:99px;
    background:linear-gradient(90deg,var(--accent),var(--accent2)); box-shadow:0 0 12px var(--accent); transition:width .12s linear; }
  .step{ margin-top:16px; font-family:"JetBrains Mono",monospace; font-size:13px; color:var(--dim); min-height:20px; }
  .note{ margin-top:auto; font-size:11px; color:#5d667d; padding-top:18px; line-height:1.5; }

  /* 완료 버튼 */
  .done-cta{ margin-top:22px; width:100%; }
  .btn{
    width:100%; font-family:"Gowun Dodum",sans-serif; font-size:17px; font-weight:bold; color:#08111f;
    background:linear-gradient(180deg,#5ee3b6,var(--ok)); border:none; border-radius:15px; padding:15px; cursor:pointer;
    box-shadow:0 5px 16px rgba(70,214,160,.35); transition:transform .1s;
  }
  .btn:active{ transform:translateY(2px); }
  .hidden{ display:none !important; }
  .check{ color:var(--ok); }

  /* ===== 결과 화면 ===== */
  .phone.warm{ background:#fff7ee; border-color:#ffe2cf; }
  .reveal{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:#3a2c24; }
  .reveal .spark{ font-size:30px; }
  .plus{ font-family:"Black Han Sans",sans-serif; font-size:54px; color:var(--warm-deep); line-height:1; margin:8px 0 2px; }
  .upgrade{ font-family:"Black Han Sans",sans-serif; font-size:21px; line-height:1.35; color:#3a2c24; }
  .upgrade .hl{ color:#2f9c95; }
  .arrowline{ font-family:"JetBrains Mono",monospace; font-size:13px; color:#a08a7c; margin-top:10px; }
  .rsub{ margin-top:14px; color:#7a675c; line-height:1.7; font-size:15px; }
  .dday{ margin-top:16px; font-family:"Black Han Sans",sans-serif; font-size:15px; color:#fff;
    background:linear-gradient(180deg,#2f9c95,#23807a); padding:7px 20px; border-radius:99px; }
  .sign{ margin-top:16px; font-size:13px; color:#a08a7c; }
  .again{ margin-top:20px; font-family:"Gowun Dodum"; font-size:14px; color:var(--warm-deep);
    background:transparent; border:1.5px solid #ffe2cf; border-radius:99px; padding:9px 20px; cursor:pointer; }

  #confetti{ position:fixed; inset:0; pointer-events:none; z-index:50; }

  .home{
    position:fixed; top:14px; left:14px; z-index:60; text-decoration:none;
    font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--txt);
    background:rgba(255,255,255,.08); border:1px solid var(--panel-line);
    padding:7px 14px; border-radius:999px; backdrop-filter:blur(4px);
  }
  .home:active{ transform:translateY(1px); }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<a class="home" href="/">← 처음으로</a>

<div class="phone" id="phone">
  <div class="statusbar">
    <span>가족 OS</span>
    <span class="dots">●●●● 📶 🔋</span>
  </div>

  <!-- 설치 화면 -->
  <div class="install" id="installScreen">
    <div class="iconwrap"><div class="ring" id="ring"></div><span id="bigIcon">📦</span></div>
    <div class="app-name" id="appName">우리 가족</div>
    <div class="ver" id="ver">v 1.0 → <b>v 2.0</b></div>

    <div class="progwrap">
      <div class="progtop">
        <span class="lbl" id="installLbl">가족 구성원 +1 설치 중...</span>
        <span class="pct" id="pct">0%</span>
      </div>
      <div class="track"><i id="fill"></i></div>
      <div class="step" id="step">업데이트 준비 중...</div>
    </div>

    <div class="done-cta hidden" id="doneCta">
      <button class="btn" id="openBtn">🎁 변경 사항 확인하기</button>
    </div>

    <div class="note" id="note">⚠️ 설치 중에는 가족을 종료하지 마세요.<br>이 업데이트는 되돌릴 수 없습니다 ♾️</div>
  </div>

  <!-- 결과 화면 -->
  <div class="reveal hidden" id="revealScreen">
    <div class="spark">🎉 ✨ 🎉</div>
    <div class="plus">+1</div>
    <div class="upgrade" id="upgrade"></div>
    <div class="arrowline" id="arrowline"></div>
    <div class="rsub" id="rsub"></div>
    <div class="dday hidden" id="dday"></div>
    <div class="sign" id="sign"></div>
    <button class="again" id="againBtn">↺ 다시 설치하기</button>
  </div>
</div>

<script>
/* ============================================================
   ✏️  이 부분만 바꾸세요
   ============================================================ */
const CONFIG = {
  installLabel: "인내심을 갖고 로딩을 기다려주세요",

  // 진행률(min)에 따라 바뀌는 설치 단계 문구
  steps: [
    { min:0,  text:"업데이트 준비 중..." },
    { min:9,  text:"아기 데이터 내려받는 중... 👶" },
    { min:24, text:"심장박동 동기화 중... 💓" },
    { min:40, text:"손가락·발가락 10개 확인 중..." },
    { min:56, text:"할머니·할아버지 권한 부여 중..." },
    { min:71, text:"사랑 저장공간 확보 중... (∞ GB)" },
    { min:85, text:"출산 예정일 일정 등록 중... 📅" },
    { min:96, text:"거의 다 됐어요... 두근두근 💓" },
  ],

  // 결과 화면
  upgrade:  '엄마, 아빠가<br><span class="hl">할머니 · 할아버지</span>로 승급! 👵👴',
  arrow:    "[ 엄마·아빠 ] → [ 할머니·할아버지 ]",
  rsub:     "내년에 손주가 새 식구로 합류해요.<br>건강하게 잘 준비할게요 ☺️",
  dueDate:  "2027-02-01",             // 예: "2026-12-20" (비우면 D-day 안 나옴)
  ddayLabel:"출산 예정일까지",
  sign:     "602♥CBH 올림",
};
/* ============================================================ */

const $ = s => document.querySelector(s);
$('#installLbl').textContent = CONFIG.installLabel;

let pct = 0;
const fill = $('#fill'), pctEl = $('#pct'), stepEl = $('#step');

function curStep(p){
  let s = CONFIG.steps[0].text;
  for(const st of CONFIG.steps){ if(p >= st.min) s = st.text; }
  return s;
}

const timer = setInterval(()=>{
  const inc = pct < 78 ? (Math.random()*3 + 1.1)
            : pct < 95 ? (Math.random()*1.0 + 0.35)
            : 0.22;                                   // 막판은 일부러 천천히 (두근두근)
  pct = Math.min(100, pct + inc);
  fill.style.width = pct + '%';
  pctEl.textContent = Math.floor(pct) + '%';
  stepEl.textContent = curStep(pct);
  if(pct >= 100){ clearInterval(timer); complete(); }
}, 50);

function complete(){
  $('#ring').style.display = 'none';
  $('#bigIcon').textContent = '✅';
  pctEl.textContent = '100%'; pctEl.classList.add('check');
  fill.style.background = 'linear-gradient(90deg,#46d6a0,#5ee3b6)';
  stepEl.innerHTML = '<span class="check">설치 완료! 다시 시작이 필요합니다.</span>';
  $('#installLbl').textContent = '설치 완료! 확인해 주세요 ✓';
  $('#note').textContent = '🎉 새로운 가족 구성원이 추가되었습니다.';
  $('#doneCta').classList.remove('hidden');
}

$('#openBtn').onclick = showReveal;
$('#againBtn').onclick = () => location.reload();

function showReveal(){
  $('#installScreen').classList.add('hidden');
  $('#phone').classList.add('warm');
  $('#revealScreen').classList.remove('hidden');
  $('.statusbar').style.color = '#c9b8a8';
  $('#upgrade').innerHTML = CONFIG.upgrade;
  $('#arrowline').textContent = CONFIG.arrow;
  $('#rsub').innerHTML = CONFIG.rsub;
  $('#sign').textContent = CONFIG.sign;
  if(CONFIG.dueDate){
    const due = new Date(CONFIG.dueDate+"T00:00:00");
    if(!isNaN(due)){
      const t = new Date(); t.setHours(0,0,0,0);
      const d = Math.round((due - t)/86400000);
      const el = $('#dday'); el.classList.remove('hidden');
      el.textContent = d>0 ? `${CONFIG.ddayLabel} D-${d}` : d===0 ? '오늘이 예정일이에요!' : `예정일에서 +${-d}일`;
    }
  }
  burst();
}

/* ---------- 꽃가루 ---------- */
const cc = $('#confetti'), cx = cc.getContext('2d');
let parts=[], raf=null;
function sizeC(){ cc.width=innerWidth; cc.height=innerHeight; }
sizeC(); addEventListener('resize', sizeC);
function burst(){
  const colors=['#ef6a52','#ffb27a','#2f9c95','#fff','#ffd27a','#46d6a0'];
  parts=[];
  for(let i=0;i<175;i++){
    parts.push({ x:innerWidth/2+(Math.random()-.5)*140, y:innerHeight*0.34,
      vx:(Math.random()-.5)*11, vy:Math.random()*-13-4, g:0.32+Math.random()*0.15,
      s:6+Math.random()*7, rot:Math.random()*6.28, vr:(Math.random()-.5)*0.4,
      c:colors[(Math.random()*colors.length)|0] });
  }
  if(!raf) tick();
}
function tick(){
  cx.clearRect(0,0,cc.width,cc.height); let alive=false;
  for(const p of parts){ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
    if(p.y<cc.height+30) alive=true;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot);
    cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); cx.restore(); }
  if(alive) raf=requestAnimationFrame(tick); else { cx.clearRect(0,0,cc.width,cc.height); raf=null; }
}
</script>
</body>
</html>
