<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>D-day 봉투</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fbf7ef; --paper:#fffdf8;
    --sage:#9fb59c; --sage-deep:#6f8f72; --sage-dark:#5a7860;
    --blush:#e8b5ac; --blush-deep:#cf8f86;
    --gold:#c4a368; --ink:#4a463f; --dim:#8c8576;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:"Gowun Dodum",sans-serif; color:var(--ink);
    background:
      radial-gradient(circle at 25% 15%, #cdddc6 0%, transparent 50%),
      radial-gradient(circle at 80% 85%, #f0d9d2 0%, transparent 55%),
      linear-gradient(160deg,#eef2e6,#f6ece6);
    min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:24px 18px; overflow-x:hidden;
  }

  .wrap{ width:100%; max-width:360px; display:flex; flex-direction:column; align-items:center; }
  .topnote{ font-family:"Gowun Batang",serif; color:var(--sage-dark); font-size:14px; letter-spacing:3px; margin-bottom:6px; }
  .toptitle{ font-family:"Gowun Batang",serif; font-weight:700; color:var(--ink); font-size:22px; letter-spacing:2px; margin-bottom:26px; }

  /* ===== 봉투 ===== */
  .scene{ position:relative; width:300px; height:200px; perspective:1400px; }
  .scene{ cursor:pointer; }

  .envelope{ position:absolute; inset:0; transform-style:preserve-3d;
    transition:opacity .5s ease, transform .5s ease; }
  .scene.opened .envelope{ opacity:0; transform:translateY(20px) scale(.92); pointer-events:none; }

  .env-back{ position:absolute; inset:0; border-radius:10px; z-index:0;
    background:linear-gradient(160deg,var(--sage),var(--sage-deep));
    box-shadow:0 20px 40px -16px rgba(60,80,60,.6); }
  .env-front{ position:absolute; left:0; right:0; bottom:0; height:62%; z-index:3;
    background:linear-gradient(160deg,#aec4aa,var(--sage-deep)); border-radius:0 0 10px 10px;
    clip-path:polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%); }
  .flap{ position:absolute; top:0; left:0; right:0; height:62%; z-index:4;
    background:linear-gradient(160deg,#bcd0b7,var(--sage)); 
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    transform-origin:top center; transition:transform .8s ease .05s; backface-visibility:hidden; }
  .scene.opening .flap, .scene.opened .flap{ transform:rotateX(180deg); z-index:0; }

  .seal{ position:absolute; top:48%; left:50%; transform:translate(-50%,-50%); z-index:6;
    width:50px; height:50px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #d9b878, var(--gold));
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:22px;
    box-shadow:0 4px 10px rgba(120,90,40,.4); transition:opacity .3s, transform .4s; }
  .scene.opening .seal, .scene.opened .seal{ opacity:0; transform:translate(-50%,-50%) scale(0); }

  .taphint{ position:absolute; left:0; right:0; bottom:-34px; text-align:center;
    font-family:"Gowun Batang",serif; color:var(--sage-dark); font-size:14px; letter-spacing:2px;
    animation:bob 1.7s ease-in-out infinite; }
  .scene.opening .taphint, .scene.opened .taphint{ opacity:0; }
  @keyframes bob{ 0%,100%{ transform:translateY(0); opacity:.7 } 50%{ transform:translateY(-4px); opacity:1 } }

  /* ===== 편지(카운트다운) ===== */
  .letter{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-46%) scale(.9);
    width:330px; max-width:92vw; background:var(--paper); border:1px solid #efe6d6; border-radius:16px;
    padding:26px 24px 24px; text-align:center; opacity:0; pointer-events:none;
    box-shadow:0 26px 55px -20px rgba(90,70,40,.45);
    transition:opacity .6s ease .5s, transform .7s cubic-bezier(.2,.85,.25,1) .5s; z-index:10;
  }
  .scene.opened .letter{ opacity:1; transform:translate(-50%,-50%) scale(1); pointer-events:auto; }

  .to{ font-family:"Gowun Batang",serif; color:var(--blush-deep); font-size:14px; letter-spacing:1px; }
  .msg{ font-family:"Gowun Batang",serif; font-size:18px; line-height:1.6; color:var(--ink); margin:10px 0 18px; }
  .divider{ width:40px; height:1px; background:var(--gold); margin:0 auto 16px; }

  .ddlabel{ font-size:13px; color:var(--dim); letter-spacing:2px; }
  .dday{ font-family:"Gowun Batang",serif; font-weight:700; font-size:60px; line-height:1;
    color:var(--sage-dark); margin:4px 0 2px; }
  .hms{ font-family:"Gowun Batang",serif; font-size:15px; color:var(--blush-deep); letter-spacing:3px; }
  .duedate{ margin-top:14px; font-size:13px; color:var(--dim); }
  .week{ margin-top:6px; display:inline-block; font-family:"Gowun Batang",serif; font-size:13px; color:#fff;
    background:linear-gradient(180deg,var(--sage),var(--sage-deep)); padding:5px 16px; border-radius:99px; }
  .from{ margin-top:18px; font-family:"Gowun Batang",serif; font-size:14px; color:var(--blush-deep); }
  .again{ margin-top:16px; font-family:"Gowun Dodum"; font-size:13px; color:var(--sage-dark);
    background:transparent; border:1px solid #e3dccb; border-radius:99px; padding:8px 18px; cursor:pointer; }

  #petals{ position:fixed; inset:0; pointer-events:none; z-index:40; }

  .home{
    position:fixed; top:14px; left:14px; z-index:60; text-decoration:none;
    font-family:"Gowun Batang",serif; font-size:13px; letter-spacing:1px; color:var(--sage-dark);
    background:rgba(255,255,255,.6); border:1px solid rgba(111,143,114,.35);
    padding:7px 14px; border-radius:999px; backdrop-filter:blur(4px);
  }
  .home:active{ transform:translateY(1px); }
</style>
</head>
<body>
<canvas id="petals"></canvas>
<a class="home" href="index.html">← 처음으로</a>

<div class="wrap">
  <div class="topnote" id="topnote">A Letter For You</div>
  <div class="toptitle" id="toptitle">엄마, 아빠께</div>

  <div class="scene" id="scene">
    <div class="envelope">
      <div class="env-back"></div>
      <div class="flap"></div>
      <div class="env-front"></div>
      <div class="seal">♥</div>
    </div>
    <div class="taphint">✦ 봉투를 탭하세요 ✦</div>

    <div class="letter" id="letter">
      <div class="to" id="to"></div>
      <div class="msg" id="msg"></div>
      <div class="divider"></div>
      <div class="ddlabel" id="ddlabel"></div>
      <div class="dday" id="dday">D-—</div>
      <div class="duedate" id="duedate"></div>
      <div class="from" id="from"></div>
      <button class="again" id="again">↺ 다시 닫기</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   ✏️  이 부분만 바꾸세요
   ============================================================ */
const CONFIG = {
  to:       "To. 사랑하는 엄마, 아빠께",
  message:  "곧 우리 가족이<br>한 명 더 늘어납니다 👶",
  ddLabel:  "손주를 만나기까지",
  dueDate:  "2027-02-01",          // 분만예정일 (주기 32일 보정). 초음파로 확정되면 여기만 수정
  from:     "From. 602 CBH",
  topTitle: "엄마, 아빠께",
};
/* ============================================================ */

const $ = s => document.querySelector(s);
$('#toptitle').textContent = CONFIG.topTitle;
$('#to').textContent = CONFIG.to;
$('#msg').innerHTML = CONFIG.message;
$('#ddlabel').textContent = CONFIG.ddLabel;
$('#from').textContent = CONFIG.from;

const scene = $('#scene');
let opened = false;
scene.addEventListener('click', e=>{
  if(e.target.closest('.letter')) return;   // 편지 안쪽 버튼 클릭은 무시
  if(opened) return;
  opened = true;
  scene.classList.add('opening');
  setTimeout(()=>{ scene.classList.add('opened'); rain(); }, 650);
});
$('#again').addEventListener('click', e=>{
  e.stopPropagation();
  opened = false;
  scene.classList.remove('opening','opened');
});

/* 카운트다운 (일 단위) */
const due = new Date(CONFIG.dueDate + "T00:00:00");

function fmtDate(d){
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
}
$('#duedate').textContent = isNaN(due) ? '' : `출산 예정일 · ${fmtDate(due)}`;

function tick(){
  const now = new Date();
  const diff = due - now;
  if(diff <= 0){
    $('#dday').textContent = 'D-DAY';
  } else {
    $('#dday').textContent = 'D-' + Math.ceil(diff/86400000);
  }
}
tick(); setInterval(tick, 60000);

/* ---------- 꽃잎 ---------- */
const cv = $('#petals'), cx = cv.getContext('2d');
let parts=[], raf=null;
function sizeC(){ cv.width=innerWidth; cv.height=innerHeight; }
sizeC(); addEventListener('resize', sizeC);
function rain(){
  const colors=['#e8b5ac','#cf8f86','#c4a368','#bcd0b7','#fff','#9fb59c'];
  parts=[];
  for(let i=0;i<120;i++){
    parts.push({ x:innerWidth/2+(Math.random()-.5)*150, y:innerHeight*0.32,
      vx:(Math.random()-.5)*8, vy:Math.random()*-11-3, g:0.25+Math.random()*0.12,
      rx:5+Math.random()*5, ry:9+Math.random()*6, rot:Math.random()*6.28, vr:(Math.random()-.5)*0.25,
      c:colors[(Math.random()*colors.length)|0] });
  }
  if(!raf) loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height); let alive=false;
  for(const p of parts){ p.vy+=p.g; p.x+=p.vx+Math.sin(p.y/40)*0.4; p.y+=p.vy; p.rot+=p.vr;
    if(p.y<cv.height+30) alive=true;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot);
    cx.fillStyle=p.c; cx.beginPath(); cx.ellipse(0,0,p.rx,p.ry,0,0,Math.PI*2); cx.fill(); cx.restore(); }
  if(alive) raf=requestAnimationFrame(loop); else { cx.clearRect(0,0,cv.width,cv.height); raf=null; }
}
</script>
</body>
</html>
